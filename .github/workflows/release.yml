name: Release

# Push a tag like 0.1 or v1.0 to build VersationEditor.exe and attach it to a GitHub release.
# "Run workflow" builds the exe as a downloadable artifact without making a release.
on:
  push:
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"          # build_exe.py prints Russian text
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Import check
        run: python -c "import ve.app, ve.tab_dialogs, ve.tab_quests, ve.tab_events, ve.preview; print('ok')"

      - name: Build exe
        run: python build_exe.py

      - uses: actions/upload-artifact@v4
        with:
          name: VersationEditor
          path: dist/VersationEditor.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VersationEditor.exe
          generate_release_notes: true
